; Suzuki Alstare Extreme Racing (Retrodeck): what the game kept in the registry (HKLM\Software\Criterion Studios\
; Suzuki Alstare Extreme Racing\1.00.000), read and written here instead by the patched SaerPC.exe (patch noreg).
; The game rewrites this file (bindings, volumes, video mode, texture settings) when you leave its Options menus.
; A control binding is three numbers: <name>1 = type (12 = key, 22 = joystick), <name>2 = what (joystick: 0 / 1 =
; stick left / right, 2 / 3 = up / down, 12 / 13 = right / left trigger, 14 + n = button n), <name>3 = 0 analogue,
; 1 a button. Pad buttons: 0 A, 1 B, 2 X, 3 Y, 4 LB, 5 RB, 7-10 D-pad, 11 View, 12 Start, 13 L3, 14 R3.
; Delete the Player0 lines for the game's own keyboard set (arrows, Page Up / Down gears, Right Ctrl turbo).
